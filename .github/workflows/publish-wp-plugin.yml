# Deploys the plugin over HTTPS, via Git Updater on the live site.
#
# This is the working path. deploy-godaddy.yml rsyncs over SSH, which the
# host stopped accepting (port 22 closed); this pulls instead of pushing, so
# it only needs 443.
#
# It force-replaces the `plugin-deploy` branch with a clean copy of the plugin
# and pings Git Updater to pull it. Production publishing is deliberately
# manual, and never deploys the database, uploads, backups or credentials.
name: Publish WordPress plugin

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: apex-wordpress-publish
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run wp:start
      - run: npm run wp:test
      - if: always()
        run: npm run wp:stop || true

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Stamp version
        shell: bash
        run: |
          set -euo pipefail
          # 2.x deliberately: the abandoned plugin-deploy branch sat at 1.12.0,
          # and Git Updater offers whatever that branch says. Anything in the
          # 1.x line risks being read as older than the stale build and walking
          # the site backwards, which is what happened before (b26199a).
          VERSION="2.${{ github.run_number }}.0"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          cd wordpress/apex-landing-page
          sed -i "s/^ \* Version: .*/ * Version: $VERSION/" apex-landing-page.php
          sed -i "s/define( 'APEX_LP_VERSION', '[^']*' )/define( 'APEX_LP_VERSION', '$VERSION' )/" apex-landing-page.php
          grep -E "Version: |APEX_LP_VERSION" apex-landing-page.php | head -2

      - name: Refuse to publish a version the site would treat as a downgrade
        shell: bash
        run: |
          set -uo pipefail
          git fetch origin plugin-deploy --depth=1 2>/dev/null || true
          PREV="$(git show origin/plugin-deploy:apex-landing-page.php 2>/dev/null \
                  | sed -n "s/^ \* Version: \(.*\)$/\1/p" | head -1)"
          if [[ -z "${PREV:-}" ]]; then
            echo "No previous plugin-deploy version found; nothing to compare."
            exit 0
          fi
          echo "previously published: $PREV   about to publish: $VERSION"
          php -r 'exit(version_compare($argv[1], $argv[2], ">") ? 0 : 1);' "$VERSION" "$PREV" || {
            echo "::error title=Refusing to publish::$VERSION is not newer than the $PREV already on plugin-deploy. Git Updater would offer the site an older build and silently revert it - exactly the incident in b26199a. Bump the version scheme before re-running."
            exit 1
          }

      - name: Lint every PHP file
        shell: bash
        run: |
          set -euo pipefail
          find wordpress/apex-landing-page -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Stage a clean copy
        shell: bash
        run: |
          set -euo pipefail
          # Same exclusions as the zip: dev files never reach the site, and the
          # 13.9MB testimonial stays out so Git Updater's download stays small.
          # The template falls back to the Media Library copy when it is absent.
          rsync -a --quiet \
            --exclude '.*' \
            --exclude '*.map' \
            --exclude '_proto/' \
            --exclude '*.mp4' \
            --exclude 'node_modules/' \
            --exclude '__MACOSX/' \
            wordpress/apex-landing-page/ "$RUNNER_TEMP/plugin/"
          echo "staged $(find "$RUNNER_TEMP/plugin" -type f | wc -l) files, $(du -sh "$RUNNER_TEMP/plugin" | cut -f1)"

      - name: Push to plugin-deploy
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/plugin"
          git init -q -b plugin-deploy
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy $VERSION from ${GITHUB_SHA::7}"
          git push --force -q \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            plugin-deploy
          echo "plugin-deploy now holds $VERSION"

      # A stale webhook is not itself a deploy failure - the branch is
      # published and the site can still pull. What matters is whether the
      # live site ends up running the new build, which the next step checks.
      - name: Tell Git Updater to pull
        continue-on-error: true
        shell: bash
        env:
          GITUPDATER_WEBHOOK_URL: ${{ secrets.GITUPDATER_WEBHOOK_URL }}
        run: |
          set -uo pipefail
          if [[ -z "${GITUPDATER_WEBHOOK_URL:-}" ]]; then
            echo "::warning::GITUPDATER_WEBHOOK_URL is not set."
            exit 0
          fi
          if curl --fail --silent --show-error --max-time 120 "$GITUPDATER_WEBHOOK_URL"; then
            echo "Git Updater pinged."
            exit 0
          fi
          # Distinguish "bad URL" from "plugin not running at all".
          if curl --silent --max-time 30 https://apex-marketing.ai/wp-json/ \
             | grep -q 'git-updater'; then
            echo "::warning title=Webhook rejected::Git Updater is active but the stored webhook URL was refused. Regenerate it under Settings -> Git Updater -> Webhooks and update the GITUPDATER_WEBHOOK_URL secret."
          else
            echo "::warning title=Git Updater inactive::Git Updater is not running on the live site - its REST namespace is absent, so the webhook 404s. Activate it in wp-admin. plugin-deploy already holds $VERSION, so once active the update will be offered there."
          fi

      - name: Verify the live site actually took it
        shell: bash
        run: |
          set -uo pipefail
          echo "Waiting for the live site to serve $VERSION ..."
          for i in $(seq 1 10); do
            sleep 30
            if bash scripts/live-smoke.sh >/tmp/smoke.log 2>&1; then
              echo "Live checks passed."
              tail -8 /tmp/smoke.log
              exit 0
            fi
          done
          echo "::error title=Published but not live::plugin-deploy holds $VERSION, but the site is not serving it after 5 minutes. Most likely Git Updater is inactive or the update needs accepting in wp-admin (Dashboard -> Updates)."
          cat /tmp/smoke.log
          exit 1
