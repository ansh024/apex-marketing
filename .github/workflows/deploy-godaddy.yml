# Verifies the Apex plugin in an isolated WordPress site, then rsyncs
# wordpress/apex-landing-page/ directly to the live site's plugin folder via
# GoDaddy's native Git Deployment (SSH, deploy-only user
# git_deployer_be953ffc02_1195086 — no interactive login, generated by
# GoDaddy itself, host/user not treated as secret per GoDaddy's own
# generated snippet). Replaces the Git Updater + webhook path in
# publish-wp-plugin.yml; once this is verified working, that workflow and
# the Git Updater plugin get retired (see docs/17-deployment-pipeline.md in
# apx-page).
#
# Deliberately manual (workflow_dispatch only): you click "Run workflow" when
# you want it live. Never deploys the database, uploads, local backups,
# environment files, or credentials.
name: Deploy to GoDaddy (native Git Deployment)

on:
  workflow_dispatch:
    inputs:
      deployment_dest:
        description: 'Target server directory (relative to site root)'
        required: false
        default: 'wp-content/plugins/apex-marketing'

permissions:
  contents: read

concurrency:
  group: apex-godaddy-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run wp:start
      - run: npm run wp:test
      - if: always()
        run: npm run wp:stop || true

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Stamp version
        shell: bash
        run: |
          set -euo pipefail
          # APEX_LP_VERSION drives the ?ver= query string on every enqueued
          # stylesheet/script. If it never changes between deploys, every
          # caching layer (LiteSpeed page cache, browser cache) keeps
          # serving old JS/CSS forever under the same URL, even though the
          # file content on disk changed — this already caused a real bug
          # (index.html shipped new markup while a browser served
          # previously-cached JS built for the old markup, throwing on
          # null.appendChild). Bumping it here, every run, is what makes a
          # deploy actually invalidate caches downstream.
          VERSION="1.${{ github.run_number }}.0"
          cd wordpress/apex-landing-page
          sed -i "s/^ \* Version: .*/ * Version: $VERSION/" apex-landing-page.php
          sed -i "s/define( 'APEX_LP_VERSION', '[^']*' )/define( 'APEX_LP_VERSION', '$VERSION' )/" apex-landing-page.php
          grep -E "Version: |APEX_LP_VERSION" apex-landing-page.php | head -2

      - name: Lint every PHP file
        shell: bash
        run: |
          set -euo pipefail
          find wordpress/apex-landing-page -type f -name '*.php' -print0 \
            | xargs -0 -n1 php -l

      - name: Synchronize Files with GoDaddy WordPress Hosting Server
        uses: godaddy-wordpress/gd-wordpress-deployer@v1
        with:
          remote_host: 'aze.636.myftpupload.com'
          ssh_user: 'git_deployer_be953ffc02_1195086'
          ssh_private_key: ${{ secrets.PRIVATE_KEY }}
          # Only sync the plugin folder itself, not the whole repo (tests,
          # node_modules, docs, wp-env config, etc. must never land on the
          # live server). deployment_dest is relative to the server's WP
          # root and must already exist there — it does, since this is
          # where Git Updater currently deploys the same plugin.
          source_path: 'wordpress/apex-landing-page'
          deployment_dest: ${{ github.event.inputs.deployment_dest }}
